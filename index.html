<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>한공부 · 韓語學習</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1A5FB4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="한공부">
<link rel="apple-touch-icon" href="/korean-study/icon-192.svg">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap');

:root {
  --bg: #EEF4FC;
  --surface: #FFFFFF;
  --border: #C8D8EE;
  --text: #0D1B2E;
  --text2: #3A5070;
  --muted: #7A96B8;
  --accent: #1A5FB4;
  --accent-soft: #E4EEFB;
  --blue: #1A5FB4;
  --blue-soft: #E4EEFB;
  --blue2: #1271C4;
  --green: #1A7A4A;
  --green-soft: #E4F4EC;
  --red-soft: #FFF0EE;
  --r: 16px;
  --rs: 10px;
  --nav-h: 72px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Noto Sans TC', 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: var(--nav-h);
  -webkit-font-smoothing: antialiased;
}

/* ── HEADER ── */
header {
  background: #1A5FB4;
  padding: 14px 20px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.logo-kr { font-family: 'Noto Sans KR'; font-size: 22px; font-weight: 700; color: white; }
.logo-zh { font-size: 13px; color: rgba(255,255,255,0.75); margin-left: 8px; }
.header-right { display: flex; gap: 10px; align-items: center; }
.hdr-btn {
  background: rgba(255,255,255,0.2);
  border: none; border-radius: 20px;
  color: white; font-size: 14px; font-weight: 500;
  padding: 6px 14px; cursor: pointer; font-family: inherit;
}
.stat-badge {
  background: rgba(255,255,255,0.25);
  border-radius: 12px;
  padding: 4px 10px;
  font-size: 13px; color: white; font-weight: 600;
}

/* ── BOTTOM NAV ── */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: var(--nav-h);
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  z-index: 100;
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-item {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 4px; cursor: pointer;
  border: none; background: none;
  color: var(--muted); font-family: inherit;
  transition: color 0.15s;
  padding: 8px 4px;
}
.nav-item.active { color: #1A5FB4; }
.nav-icon { font-size: 24px; line-height: 1; }
.nav-label { font-size: 11px; font-weight: 600; }

/* ── MAIN ── */
main { padding: 20px 16px; max-width: 600px; margin: 0 auto; }

/* ── SECTIONS ── */
.section { display: none; }
.section.active { display: block; }

/* ── PAGE TITLE ── */
.page-title {
  font-size: 13px; font-weight: 700;
  color: var(--muted); text-transform: uppercase;
  letter-spacing: 1px; margin-bottom: 18px;
}

/* ── SCAN ── */
.upload-box {
  background: var(--surface);
  border: 2px dashed var(--border);
  border-radius: var(--r);
  padding: 36px 20px;
  text-align: center;
  margin-bottom: 14px;
}
.upload-box .icon { font-size: 52px; margin-bottom: 10px; }
.upload-box h2 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
.upload-box p { color: var(--text2); font-size: 16px; line-height: 1.6; }

.btn-row { display: flex; gap: 12px; margin-bottom: 14px; }
.btn-primary {
  flex: 1; padding: 16px; border: none; border-radius: var(--r);
  background: #1A5FB4; color: white;
  font-size: 18px; font-weight: 700; cursor: pointer; font-family: inherit;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-secondary {
  flex: 1; padding: 16px; border: 1px solid var(--border); border-radius: var(--r);
  background: var(--surface); color: var(--text);
  font-size: 18px; font-weight: 700; cursor: pointer; font-family: inherit;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-green {
  width: 100%; padding: 16px; border: none; border-radius: var(--r);
  background: var(--green); color: white;
  font-size: 18px; font-weight: 700; cursor: pointer; font-family: inherit;
  margin-top: 14px;
}

.preview-img {
  width: 100%; max-height: 300px; object-fit: contain;
  border-radius: var(--r); border: 1px solid var(--border);
  margin-bottom: 12px;
}
.analyze-btn {
  width: 100%; padding: 18px; border: none; border-radius: var(--r);
  background: var(--accent); color: white;
  font-size: 20px; font-weight: 700; cursor: pointer; font-family: inherit;
}
.analyze-btn:disabled { opacity: 0.4; }

/* loading */
.loading { display: none; text-align: center; padding: 40px 20px; }
.loading.show { display: block; }
.spinner {
  width: 40px; height: 40px;
  border: 4px solid var(--border); border-top-color: #1A5FB4;
  border-radius: 50%; animation: spin 0.8s linear infinite;
  margin: 0 auto 14px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading p { font-size: 17px; color: var(--text2); }

/* result */
.result-box { display: none; }
.result-box.show { display: block; }
.result-card {
  background: var(--surface); border-radius: var(--r);
  border: 1px solid var(--border); margin-bottom: 14px; overflow: hidden;
}
.result-card-header {
  padding: 14px 18px; background: var(--bg);
  border-bottom: 1px solid var(--border);
  font-size: 15px; font-weight: 700; color: var(--text2);
}
.result-card-body { padding: 14px 18px; }

/* vocab row in result */
.vrow {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 0; border-bottom: 1px solid var(--border);
}
.vrow:last-child { border-bottom: none; }
.vrow-kr { font-family: 'Noto Sans KR'; font-size: 22px; font-weight: 700; min-width: 90px; }
.vrow-rom { font-size: 14px; color: var(--muted); min-width: 80px; }
.vrow-zh { font-size: 17px; flex: 1; }
.tts-btn { background: none; border: none; font-size: 22px; cursor: pointer; padding: 4px; }

/* ── CARDS ── */
.filter-row { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.filter-chip {
  padding: 8px 16px; border-radius: 20px;
  border: 1px solid var(--border); background: var(--surface);
  font-size: 15px; cursor: pointer; font-family: inherit; color: var(--text2);
  font-weight: 500;
}
.filter-chip.active { background: #1A5FB4; border-color: #1A5FB4; color: white; }

.card-counter { text-align: center; font-size: 16px; color: var(--muted); margin-bottom: 12px; }

.card-scene {
  width: 100%; height: 260px;
  perspective: 1000px; cursor: pointer; margin-bottom: 18px;
}
.card-inner {
  width: 100%; height: 100%;
  position: relative; transform-style: preserve-3d;
  transition: transform 0.45s cubic-bezier(0.4,0,0.2,1);
}
.card-inner.flipped { transform: rotateY(180deg); }
.card-face {
  position: absolute; inset: 0;
  background: var(--surface); border-radius: var(--r);
  border: 1px solid var(--border);
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  backface-visibility: hidden;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 28px; text-align: center; gap: 12px;
}
.card-face.back { transform: rotateY(180deg); background: var(--blue-soft); }
.card-label { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
.card-kr { font-family: 'Noto Sans KR'; font-size: 52px; font-weight: 700; line-height: 1.1; }
.card-rom { font-size: 18px; color: var(--text2); }
.card-zh { font-size: 32px; font-weight: 700; color: #1A5FB4; }
.card-tap { font-size: 15px; color: var(--muted); }

.card-btns { display: flex; gap: 12px; }
.card-btn {
  flex: 1; padding: 16px 8px; border-radius: var(--r);
  border: 1.5px solid var(--border); background: var(--surface);
  font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit;
}
.card-btn.again { border-color: var(--accent); color: var(--accent); }
.card-btn.speak { border-color: var(--blue); color: var(--blue); }
.card-btn.good { border-color: var(--green); color: var(--green); }
.card-btn.del { border-color: #C62828; color: #C62828; flex: 0 0 56px; padding: 16px 4px; }

/* ── FILL ── */
.fill-card {
  background: var(--surface); border-radius: var(--r);
  border: 1px solid var(--border); padding: 22px;
  margin-bottom: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}
.fill-q { font-size: 20px; line-height: 2; margin-bottom: 12px; }
.fill-input {
  display: inline-block; min-width: 90px;
  border: none; border-bottom: 3px solid var(--accent);
  font-size: 22px; font-family: 'Noto Sans KR', sans-serif;
  font-weight: 700; color: var(--accent); background: transparent;
  outline: none; text-align: center; padding: 2px 6px;
  vertical-align: middle;
}
.fill-input.correct { border-color: var(--green); color: var(--green); }
.fill-input.wrong { border-color: #C62828; color: #C62828; }
.fill-hint { font-size: 16px; color: var(--muted); margin-bottom: 12px; }
.fill-reveal { font-size: 16px; color: var(--text2); display: none; margin-bottom: 10px; }
.fill-reveal.show { display: block; }
.confirm-btn {
  padding: 12px 28px; background: var(--accent); color: white;
  border: none; border-radius: var(--rs); font-size: 17px;
  font-weight: 700; cursor: pointer; font-family: inherit;
}

/* ── PRON ── */
.pron-card {
  background: var(--surface); border-radius: var(--r);
  border: 1px solid var(--border); padding: 20px;
  margin-bottom: 12px; display: flex; align-items: center; gap: 16px;
}
.pron-kr { font-family: 'Noto Sans KR'; font-size: 34px; font-weight: 700; min-width: 110px; }
.pron-info { flex: 1; }
.pron-rom { font-size: 15px; color: var(--muted); }
.pron-zh { font-size: 20px; font-weight: 500; }
.pron-play {
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--blue); color: white; border: none;
  font-size: 22px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.pron-del {
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--red-soft); color: #C62828; border: 1px solid #F0C4C0;
  font-size: 20px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

/* ── GRAMMAR ── */
.grammar-card {
  background: var(--surface); border-radius: var(--r);
  border: 1px solid var(--border); margin-bottom: 14px; overflow: hidden;
}
.grammar-hdr {
  padding: 18px 20px; background: var(--blue-soft);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; cursor: pointer; gap: 12px;
}
.grammar-hdr-text { flex: 1; }
.grammar-name { font-size: 19px; font-weight: 700; }
.grammar-kr-form { font-family: 'Noto Sans KR'; font-size: 22px; color: var(--blue); margin-top: 2px; }
.grammar-body { padding: 18px 20px; display: none; }
.grammar-body.open { display: block; }
.grammar-pattern {
  font-family: 'Noto Sans KR'; background: var(--bg);
  padding: 12px 16px; border-radius: var(--rs);
  font-size: 18px; color: var(--blue); font-weight: 600; margin-bottom: 14px;
}
.grammar-ex { list-style: none; }
.grammar-ex li { padding: 10px 0; border-bottom: 1px solid var(--border); }
.grammar-ex li:last-child { border-bottom: none; }
.grammar-ex-kr { font-family: 'Noto Sans KR'; font-size: 20px; margin-bottom: 4px; }
.grammar-ex-zh { font-size: 16px; color: var(--text2); }

/* ── QUIZ ── */
.quiz-meta { display: flex; justify-content: space-between; margin-bottom: 12px; }
.quiz-meta span { font-size: 17px; color: var(--text2); font-weight: 600; }
.progress-bar { height: 6px; background: var(--border); border-radius: 3px; margin-bottom: 22px; }
.progress-fill { height: 100%; background: #1A5FB4; border-radius: 3px; transition: width 0.3s; }
.quiz-word-card {
  background: var(--surface); border-radius: var(--r);
  border: 1px solid var(--border); padding: 36px 24px;
  text-align: center; margin-bottom: 18px;
}
.quiz-prompt { font-size: 17px; color: var(--text2); margin-bottom: 14px; }
.quiz-word { font-family: 'Noto Sans KR'; font-size: 56px; font-weight: 700; }
.quiz-rom { font-size: 17px; color: var(--muted); margin-top: 8px; }
.quiz-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.quiz-opt {
  padding: 18px 12px; background: var(--surface);
  border: 1.5px solid var(--border); border-radius: var(--r);
  font-size: 18px; cursor: pointer; font-family: inherit;
  text-align: center; line-height: 1.4; font-weight: 500;
}
.quiz-opt:disabled { cursor: default; }
.quiz-opt.correct { background: var(--green-soft); border-color: var(--green); color: var(--green); font-weight: 700; }
.quiz-opt.wrong { background: var(--red-soft); border-color: #C62828; color: #C62828; }

.score-card {
  background: var(--surface); border-radius: var(--r);
  border: 1px solid var(--border); padding: 48px 24px; text-align: center;
}
.score-num { font-size: 80px; font-weight: 700; color: #1A5FB4; }
.score-label { font-size: 20px; color: var(--text2); margin-top: 8px; }
.retry-btn {
  margin-top: 24px; padding: 16px 40px;
  background: var(--accent); color: white; border: none;
  border-radius: var(--r); font-size: 18px; font-weight: 700;
  cursor: pointer; font-family: inherit;
}

/* ── EMPTY ── */
.empty {
  text-align: center; padding: 60px 24px;
}
.empty .eicon { font-size: 56px; margin-bottom: 14px; }
.empty h3 { font-size: 20px; font-weight: 700; color: var(--text2); margin-bottom: 8px; }
.empty p { font-size: 17px; color: var(--muted); }

/* ── TOAST ── */
.toast {
  position: fixed; bottom: calc(var(--nav-h) + 16px); left: 50%;
  transform: translateX(-50%) translateY(60px);
  background: #1A1916; color: white;
  padding: 12px 24px; border-radius: 24px;
  font-size: 16px; z-index: 999; transition: transform 0.25s;
  white-space: nowrap; font-weight: 500;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* ── LIBRARY HEADER ── */
.lib-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 18px;
}
.lib-count { font-size: 16px; color: var(--text2); font-weight: 600; }
.lib-clear {
  padding: 6px 14px; border: 1px solid #C62828; border-radius: 20px;
  background: none; color: #C62828; font-size: 14px; cursor: pointer; font-family: inherit;
}

/* ── TABS ── */
.tab-row {
  display: flex; gap: 8px; margin-bottom: 18px;
}
.tab-btn {
  flex: 1; padding: 12px 8px; border-radius: var(--rs);
  border: 1.5px solid var(--border); background: var(--surface);
  font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit;
  color: var(--text2); transition: all 0.15s;
}
.tab-btn.active { background: #1A5FB4; border-color: #1A5FB4; color: white; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ── SENT CARD ── */
.sent-scene {
  width: 100%; min-height: 220px;
  perspective: 1000px; cursor: pointer; margin-bottom: 18px;
}
.sent-inner {
  width: 100%; min-height: 220px;
  position: relative; transform-style: preserve-3d;
  transition: transform 0.45s cubic-bezier(0.4,0,0.2,1);
}
.sent-inner.flipped { transform: rotateY(180deg); }
.sent-face {
  position: absolute; inset: 0;
  background: var(--surface); border-radius: var(--r);
  border: 1px solid var(--border);
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  backface-visibility: hidden;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 28px 24px; text-align: center; gap: 14px;
  min-height: 220px;
}
.sent-face.back { transform: rotateY(180deg); background: #D6E8FB; }
.sent-label { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
.sent-zh { font-size: 22px; font-weight: 600; line-height: 1.5; color: var(--text); }
.sent-kr { font-family: "Noto Sans KR"; font-size: 22px; font-weight: 700; line-height: 1.6; color: var(--blue); }
.sent-tap { font-size: 15px; color: var(--muted); }
.sent-counter { text-align: center; font-size: 16px; color: var(--muted); margin-bottom: 12px; }
.sent-btns { display: flex; gap: 12px; }
.sent-btn {
  flex: 1; padding: 16px 8px; border-radius: var(--r);
  border: 1.5px solid var(--border); background: var(--surface);
  font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit;
}
.sent-btn.play { border-color: var(--blue); color: var(--blue); }
.sent-btn.next { border-color: var(--green); color: var(--green); }
</style>
</head>
<body>

<header>
  <div>
    <span class="logo-kr">한공부</span>
    <span class="logo-zh">韓語學習</span>
  </div>
  <div class="header-right">
    <span class="stat-badge" id="totalBadge">0 個單字</span>
    <button class="hdr-btn" onclick="showApiSettings()">⚙️</button>
  </div>
</header>

<main>
  <!-- ── 掃描 ── -->
  <div class="section active" id="sec-scan">
    <div class="page-title">➕ 加入內容</div>
    <div class="tab-row" style="margin-bottom:16px">
      <button class="tab-btn active" id="scanTabPhoto" onclick="switchScanTab('photo',this)">📷 拍照/圖片</button>
      <button class="tab-btn" id="scanTabText" onclick="switchScanTab('text',this)">📝 貼上文字</button>
    </div>

    <!-- 圖片模式 -->
    <div id="scanPhoto">
    <div class="upload-box" id="uploadBox">
      <div class="icon">📖</div>
      <h2>上傳書頁照片</h2>
      <p>AI 自動識別單字、文法和例句</p>
    </div>
    <div class="btn-row">
      <button class="btn-primary" onclick="document.getElementById('camInput').click()">📷 拍照</button>
      <button class="btn-secondary" onclick="document.getElementById('galInput').click()">🖼️ 圖庫</button>
    </div>
    <input type="file" accept="image/*" capture="environment" id="camInput" onchange="handleFile(event)" style="display:none">
    <input type="file" accept="image/*" id="galInput" onchange="handleFile(event)" style="display:none">

    <div id="previewArea" style="display:none">
      <img id="previewImg" class="preview-img">
      <button class="analyze-btn" id="analyzeBtn" onclick="analyze()">🤖 分析書頁內容</button>
    </div>
    </div><!-- end scanPhoto -->

    <!-- 文字模式 -->
    <div id="scanText" style="display:none">
      <textarea id="textInput" placeholder="貼上韓文文章、課文或對話⋯&#10;&#10;AI 會自動分析生字和可練習的例句" style="width:100%;min-height:200px;padding:16px;font-size:17px;font-family:inherit;border:1.5px solid var(--border);border-radius:var(--r);background:var(--surface);resize:vertical;outline:none;line-height:1.8;color:var(--text)"></textarea>
      <button class="analyze-btn" style="margin-top:12px" onclick="analyzeText()">🤖 分析文字內容</button>
    </div>

    <div class="loading" id="loadingDiv">
      <div class="spinner"></div>
      <p>AI 正在識別書頁內容……</p>
    </div>

    <div class="result-box" id="resultBox">
      <div class="result-card" id="resVocab" style="display:none">
        <div class="result-card-header">📚 識別到的單字</div>
        <div class="result-card-body" id="resVocabBody"></div>
      </div>
      <div class="result-card" id="resNotes" style="display:none">
        <div class="result-card-header">📝 文法要點</div>
        <div class="result-card-body" id="resNotesBody" style="font-size:16px;line-height:1.9;color:var(--text2);white-space:pre-wrap"></div>
      </div>
      <div class="result-card" id="resSentences" style="display:none">
        <div class="result-card-header">💬 例句</div>
        <div class="result-card-body" id="resSentBody"></div>
      </div>
      <button class="btn-green" onclick="saveAll()">✅ 加入學習庫</button>
    </div>
  </div>

  <!-- ── 單字卡 ── -->
  <div class="section" id="sec-cards">
    <div class="lib-header">
      <div class="page-title" style="margin:0">🃏 單字卡</div>
      <span class="lib-count" id="cardsCount"></span>
    </div>
    <div class="filter-row">
      <button class="filter-chip active" onclick="setFilter('all',this)">全部</button>
      <button class="filter-chip" onclick="setFilter('again',this)">❌ 再練習</button>
      <button class="filter-chip" onclick="setFilter('good',this)">✅ 掌握</button>

      <div class="page-title" style="margin:0">💬 例句</div>
      <button class="lib-clear" onclick="dedupeSentences()">🧹 清除重複</button>
    </div>
    <div class="tab-row">
      <button class="tab-btn active" onclick="switchTab('sent-list',this)">例句列表</button>
      <button class="tab-btn" onclick="switchTab('sent-card',this)">例句卡</button>
    </div>
    <div id="sent-list" class="tab-panel active"><div id="sentListArea"></div></div>
    <div id="sent-card" class="tab-panel"><div id="sentCardArea"></div></div>
  </div>

  <!-- ── 發音 ── -->
  <div class="section" id="sec-pron">
    <div class="lib-header">
      <div class="page-title" style="margin:0">🔊 發音對照</div>
      <button class="lib-clear" onclick="dedupeVocab()">🧹 清除重複</button>
    </div>
    <div id="pronArea"></div>
  </div>

  <!-- ── 文法 ── -->
  <div class="section" id="sec-grammar">
    <div class="page-title">📝 文法筆記</div>

  </button>

    <span class="nav-icon">💬</span><span class="nav-label">例句</span>
  </button>

    <span class="nav-icon">🔊</span><span class="nav-label">發音</span>
  </button>

    <span class="nav-icon">📝</span><span class="nav-label">文法</span>

    <span class="nav-icon">🧪</span><span class="nav-label">Quiz</span>
  </button>
</nav>

<div class="toast" id="toast"></div>

<script>
// ── STORAGE ──
function save(key, val) { localStorage.setItem(key, JSON.stringify(val)); }
function load(key, def) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch { return def; } }

// ── STATE (loaded from localStorage) ──
let vocab = load('vocab', []);       // {kr, reading, zh, status}
let grammar = load('grammar', []);   // {title, kr, pattern, examples}
let sentences = load('sentences', []); // {kr, zh}
let imageBase64 = null;
let filteredVocab = [...vocab];
let cardIdx = 0;
let quizQs = [], quizIdx = 0, quizScore = 0;

// ── NAV ──
function nav(name, btn) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  document.getElementById('sec-' + name).classList.add('active');
  btn.classList.add('active');
  if (name === 'cards') { filteredVocab = [...vocab]; cardIdx = 0; renderCard(); }
  if (name === 'fill') { renderSentList(); }
  if (name === 'pron') renderPron();
  if (name === 'grammar') renderGrammar();
  if (name === 'quiz') startQuiz();
  updateBadge();
}

function updateBadge() {
  document.getElementById('totalBadge').textContent = vocab.length + ' 個單字';
}
updateBadge();

// ── FILE ──
function handleFile(e) {
  const file = e.target.files[0]; if (!file) return;
  const mimeType = file.type || 'image/jpeg';
  const reader = new FileReader();
  reader.onload = ev => {
    const dataUrl = ev.target.result;
    // Extract base64 with correct mime type
    imageBase64 = dataUrl.split(',')[1];
    window._imageMime = mimeType;
    document.getElementById('previewImg').src = dataUrl;
    document.getElementById('previewArea').style.display = 'block';
    document.getElementById('resultBox').classList.remove('show');
    // Reset input AFTER load completes so Android doesn't cancel
    e.target.value = '';
    toast('✅ 照片已載入，按「分析」開始');
  };
  reader.onerror = () => toast('⚠️ 讀取圖片失敗，請再試一次');
  reader.readAsDataURL(file);
}

// ── API ──
function getKey() { return localStorage.getItem('geminiKey') || ''; }
function showApiSettings() {
  const cur = getKey();
  const k = prompt('Gemini API Key\n免費取得：aistudio.google.com → Get API Key', cur ? '（已設定，輸入新的換掉）' : '');
  if (k && k.trim() && k !== '（已設定，輸入新的換掉）') {
    localStorage.setItem('geminiKey', k.trim());
    toast('✅ API Key 已儲存');
  }
}

// ── ANALYZE ──
async function analyze() {
  const key = getKey();
  if (!key) {
    if (confirm('需要設定 Gemini API Key。\n前往設定？')) showApiSettings();
    return;
  }
  if (!imageBase64) return;
  document.getElementById('analyzeBtn').disabled = true;
  document.getElementById('loadingDiv').classList.add('show');
  document.getElementById('resultBox').classList.remove('show');

  const prompt = `你是韓語教學助手。分析這張韓語書頁圖片，提取所有學習內容。
嚴格以JSON回應，不要markdown：
{"vocab":[{"kr":"韓文","reading":"羅馬拼音","zh":"中文"}],"grammar":[{"title":"文法名稱","kr":"韓文形式","pattern":"說明","examples":[{"kr":"例句","zh":"翻譯"}]}],"sentences":[{"kr":"句子","zh":"翻譯"}],"notes":"文法備注"}`;

  try {
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [
            { inline_data: { mime_type: window._imageMime || 'image/jpeg', data: imageBase64 } },
            { text: prompt }
          ]}],
          generationConfig: { temperature: 0.1 }
        })
      }
    );
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    const text = data.candidates[0].content.parts[0].text;
    const clean = text.replace(/```json|```/g,'').trim();
    renderResult(JSON.parse(clean));
  } catch(err) {
    toast('⚠️ ' + err.message);
  } finally {
    document.getElementById('analyzeBtn').disabled = false;
    document.getElementById('loadingDiv').classList.remove('show');
  }
}

// pending data from scan
let _pVocab = [], _pGrammar = [], _pSentences = [];

function renderResult(d) {
  _pVocab = d.vocab || [];
  _pGrammar = d.grammar || [];
  _pSentences = d.sentences || [];

  // vocab
  const rv = document.getElementById('resVocab');
  const rb = document.getElementById('resVocabBody');
  if (_pVocab.length) {
    rb.innerHTML = _pVocab.map(v => `
      <div class="vrow">
        <div class="vrow-kr">${v.kr}</div>
        <div class="vrow-rom">${v.reading||''}</div>
        <div class="vrow-zh">${v.zh}</div>
        <button class="tts-btn" onclick="speak('${esc(v.kr)}')">🔊</button>
      </div>`).join('');
    rv.style.display = 'block';
  } else rv.style.display = 'none';

  // notes
  const rn = document.getElementById('resNotes');
  if (d.notes && d.notes.trim()) {
    document.getElementById('resNotesBody').textContent = d.notes;
    rn.style.display = 'block';
  } else rn.style.display = 'none';

  // sentences
  const rs = document.getElementById('resSentences');
  const rsb = document.getElementById('resSentBody');
  if (_pSentences.length) {
    rsb.innerHTML = _pSentences.map(s => `
      <div class="vrow">
        <div style="flex:1">
          <div style="font-family:'Noto Sans KR';font-size:20px;font-weight:600;margin-bottom:4px">${s.kr}</div>
          <div style="font-size:16px;color:var(--text2)">${s.zh}</div>
        </div>
        <button class="tts-btn" onclick="speak('${esc(s.kr)}')">🔊</button>
      </div>`).join('');
    rs.style.display = 'block';
  } else rs.style.display = 'none';

  document.getElementById('resultBox').classList.add('show');
}

function saveAll() {
  let added = 0;
  _pVocab.forEach(v => {
    if (!vocab.find(x => x.kr === v.kr)) { vocab.push({...v, status:'new'}); added++; }
  });
  _pGrammar.forEach(g => {
    if (!grammar.find(x => x.title === g.title)) grammar.push(g);
  });
  _pSentences.forEach(s => {
    if (!sentences.find(x => x.kr === s.kr)) sentences.push(s);
  });
  save('vocab', vocab);
  save('grammar', grammar);
  save('sentences', sentences);
  toast(`✅ 新增 ${added} 個單字，共 ${vocab.length} 個`);
  updateBadge();
}

// ── FLASHCARDS ──
function setFilter(f, btn) {
  document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filteredVocab = f === 'all' ? [...vocab] : vocab.filter(v => v.status === f);
  cardIdx = 0; renderCard();
}
function shuffleVocab(btn) {
  document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filteredVocab = [...vocab].sort(() => Math.random()-0.5);
  cardIdx = 0; renderCard();
}

function renderCard() {
  const area = document.getElementById('cardArea');
  const cnt = document.getElementById('cardsCount');
  if (!vocab.length) {
    area.innerHTML = emptyState('🃏','還沒有單字卡','先用掃描功能上傳書頁');
    cnt.textContent = ''; return;
  }
  if (!filteredVocab.length) {
    area.innerHTML = emptyState('🎉','這個分類沒有單字','');
    cnt.textContent = ''; return;
  }
  cnt.textContent = `${cardIdx+1} / ${filteredVocab.length}`;
  const v = filteredVocab[cardIdx];
  area.innerHTML = `
    <div class="card-counter">${cardIdx+1} / ${filteredVocab.length}</div>
    <div class="card-scene" onclick="flipCard(this)">
      <div class="card-inner">
        <div class="card-face front">
          <div class="card-label">韓文</div>
          <div class="card-kr">${v.kr}</div>
          <div class="card-rom">${v.reading||''}</div>
          <div class="card-tap">點擊翻面</div>
        </div>
        <div class="card-face back">
          <div class="card-label">中文</div>
          <div class="card-zh">${v.zh}</div>
          <div class="card-kr" style="font-size:36px">${v.kr}</div>
          <div class="card-rom">${v.reading||''}</div>
        </div>
      </div>
    </div>
    <div class="card-btns">
      <button class="card-btn again" onclick="markCard('again')">❌ 再練</button>
      <button class="card-btn speak" onclick="speak('${esc(v.kr)}')">🔊 發音</button>
      <button class="card-btn good" onclick="markCard('good')">✅ 掌握</button>
      <button class="card-btn del" onclick="deleteCurrentCard()">🗑️</button>
    </div>`;
}

function flipCard(el) { el.querySelector('.card-inner').classList.toggle('flipped'); }

function markCard(status) {
  if (!filteredVocab.length) return;
  const v = filteredVocab[cardIdx];
  const orig = vocab.find(x => x.kr === v.kr);
  if (orig) { orig.status = status; save('vocab', vocab); }
  cardIdx = (cardIdx+1) % filteredVocab.length;
  renderCard();
}

function deleteCurrentCard() {
  if (!filteredVocab.length) return;
  const v = filteredVocab[cardIdx];
  if (!confirm(`確定要刪除「${v.kr}」嗎？`)) return;
  const idx = vocab.findIndex(x => x.kr === v.kr && x.zh === v.zh);
  if (idx > -1) vocab.splice(idx, 1);
  filteredVocab.splice(cardIdx, 1);
  if (cardIdx >= filteredVocab.length) cardIdx = Math.max(0, filteredVocab.length - 1);
  save('vocab', vocab);
  updateBadge();
  renderCard();
}

// ── FILL ──
// ── TAB SWITCH ──
// ── SCAN TAB SWITCH ──
function switchScanTab(mode, btn) {
  document.querySelectorAll('#scanTabPhoto, #scanTabText').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('scanPhoto').style.display = mode === 'photo' ? 'block' : 'none';
  document.getElementById('scanText').style.display = mode === 'text' ? 'block' : 'none';
  // 清除結果
  document.getElementById('resultBox').classList.remove('show');
  document.getElementById('loadingDiv').classList.remove('show');
}

// ── ANALYZE TEXT ──
async function analyzeText() {
  const text = document.getElementById('textInput').value.trim();
  if (!text) { toast('請先貼上文字'); return; }
  const key = getKey();
  if (!key) { if (confirm('需要設定 Gemini API Key。\n前往設定？')) showApiSettings(); return; }

  document.getElementById('loadingDiv').classList.add('show');
  document.getElementById('resultBox').classList.remove('show');

  const prompt = `你是韓語教學助手。請分析以下韓文文章，提取學習內容。
嚴格以JSON回應，不要markdown：
{"vocab":[{"kr":"生字韓文","reading":"羅馬拼音","zh":"中文意思"}],"grammar":[{"title":"文法名稱","kr":"韓文形式","pattern":"說明","examples":[{"kr":"例句","zh":"翻譯"}]}],"sentences":[{"kr":"可練習的完整句子","zh":"中文翻譯"}],"notes":"文法備注"}

請盡量提取所有生字，以及3-8個適合練習的例句。

文章內容：
${text}`;

  try {
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: { temperature: 0.1 }
        })
      }
    );
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    const raw = data.candidates[0].content.parts[0].text;
    const clean = raw.replace(/```json|```/g,'').trim();
    renderResult(JSON.parse(clean));
  } catch(err) {
    toast('⚠️ ' + err.message);
  } finally {
    document.getElementById('loadingDiv').classList.remove('show');
  }
}

// ── TAB SWITCH (例句頁) ──
function switchTab(id, btn) {
  const panel = btn.closest('.section');
  panel.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  panel.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(id).classList.add('active');
  if (id === 'sent-list') renderSentList();
  if (id === 'sent-card') renderSentCard();
}

function renderFill() { renderSentList(); }

// ── 例句列表 ──
function renderSentList() {
  const area = document.getElementById('sentListArea');
  const all = getAllSentences();
  if (!all.length) { area.innerHTML = emptyState('💬','還沒有例句','先掃描書頁或貼上文字'); return; }
  area.innerHTML = `
    <div style="font-size:15px;color:var(--muted);margin-bottom:14px">共 ${all.length} 個例句</div>
    ${all.map((s,i) => `
      <div class="pron-card" style="flex-direction:column;align-items:flex-start;gap:10px">
        <div style="display:flex;align-items:flex-start;gap:10px;width:100%">
          <div style="flex:1">
            <div style="font-family:'Noto Sans KR';font-size:20px;font-weight:700;line-height:1.6;margin-bottom:6px">${s.kr}</div>
            <div style="font-size:17px;color:var(--text2);line-height:1.5">${s.zh}</div>
          </div>
          <button class="pron-play" onclick="speak('${esc(s.kr)}')" style="flex-shrink:0;margin-top:4px">▶</button>
          <button class="pron-del" onclick="deleteSentence(${i})" style="flex-shrink:0;margin-top:4px">🗑️</button>
        </div>
      </div>`).join('')}`;
}

// getAllSentences tags each item with its origin so it can be deleted correctly:
// _src 's' = standalone sentences array (index _i)
// _src 'g' = example nested inside a grammar entry (grammar index _gi, example index _ei)
function getAllSentences() {
  const all = sentences.map((s, i) => ({ ...s, _src: 's', _i: i }));
  grammar.forEach((g, gi) => g.examples?.forEach((ex, ei) => {
    if (!all.find(x => x.kr === ex.kr)) all.push({ ...ex, _src: 'g', _gi: gi, _ei: ei });
  }));
  return all;
}

function deleteSentence(i) {
  const all = getAllSentences();
  const item = all[i]; if (!item) return;
  if (!confirm('確定要刪除這個例句嗎？')) return;
  if (item._src === 's') {
    sentences.splice(item._i, 1);
    save('sentences', sentences);
  } else {
    grammar[item._gi].examples.splice(item._ei, 1);
    save('grammar', grammar);
  }
  renderSentList();
}

function dedupeSentences() {
  const seen = new Set();
  const before = sentences.length;
  sentences = sentences.filter(s => {
    const key = s.kr + '|' + s.zh;
    if (seen.has(key)) return false;
    seen.add(key); return true;
  });
  save('sentences', sentences);
  renderSentList();
  toast(`✅ 已移除 ${before - sentences.length} 個重複例句（不含文法內的例句）`);
}

// ── 例句卡 ──
let sentIdx = 0;
let sentList = [];

function renderSentCard() {
  const area = document.getElementById('sentCardArea');
  sentList = getAllSentences();
  if (!sentList.length) {
    area.innerHTML = emptyState('💬','還沒有例句','先掃描書頁或貼上文字');
    return;
  }
  sentIdx = 0;
  renderOneSentCard();
}

function renderOneSentCard() {
  const area = document.getElementById('sentCardArea');
  if (!sentList.length) return;
  const s = sentList[sentIdx];
  area.innerHTML = `
    <div class="sent-counter">${sentIdx+1} / ${sentList.length}</div>
    <div class="sent-scene" onclick="flipSent(this)">
      <div class="sent-inner">
        <div class="sent-face front">
          <div class="sent-label">中文</div>
          <div class="sent-zh">${s.zh}</div>
          <div class="sent-tap">點擊看韓文</div>
        </div>
        <div class="sent-face back">
          <div class="sent-label">韓文</div>
          <div class="sent-kr">${s.kr}</div>
        </div>
      </div>
    </div>
    <div class="sent-btns">
      <button class="sent-btn play" onclick="speak('${esc(s.kr)}')">🔊 朗讀</button>
      <button class="sent-btn next" onclick="nextSent()">下一句 →</button>
    </div>`;
}

function flipSent(el) { el.querySelector('.sent-inner').classList.toggle('flipped'); }

function nextSent() {
  sentIdx = (sentIdx + 1) % sentList.length;
  renderOneSentCard();
}

// ── PRON ──
function renderPron() {
  const area = document.getElementById('pronArea');
  if (!vocab.length) { area.innerHTML = emptyState('🔊','還沒有單字','先用掃描功能上傳書頁'); return; }
  area.innerHTML = vocab.map((v,i) => `
    <div class="pron-card">
      <div class="pron-kr">${v.kr}</div>
      <div class="pron-info">
        <div class="pron-rom">${v.reading||''}</div>
        <div class="pron-zh">${v.zh}</div>
      </div>
      <button class="pron-play" onclick="speak('${esc(v.kr)}')">▶</button>
      <button class="pron-del" onclick="deleteVocab(${i})">🗑️</button>
    </div>`).join('');
}

function deleteVocab(i) {
  const v = vocab[i]; if (!v) return;
  if (!confirm(`確定要刪除「${v.kr}」嗎？`)) return;
  vocab.splice(i, 1);
  save('vocab', vocab);
  updateBadge();
  renderPron();
}

function dedupeVocab() {
  const seen = new Set();
  const before = vocab.length;
  vocab = vocab.filter(v => {
    const key = v.kr + '|' + v.zh;
    if (seen.has(key)) return false;
    seen.add(key); return true;
  });
  save('vocab', vocab);
  updateBadge();
  renderPron();
  toast(`✅ 已移除 ${before - vocab.length} 個重複單字`);
}

// ── GRAMMAR ──
function renderGrammar() {
  const area = document.getElementById('grammarArea');
  if (!grammar.length) { area.innerHTML = emptyState('📝','還沒有文法筆記','先用掃描功能上傳書頁'); return; }
  area.innerHTML = grammar.map((g,i) => `
    <div class="grammar-card">
      <div class="grammar-hdr" onclick="toggleG(${i})">
        <div class="grammar-hdr-text">
          <div class="grammar-name">${g.title||''}</div>
          <div class="grammar-kr-form">${g.kr||''}</div>
        </div>
        <span id="ga${i}">▼</span>
      </div>
      <div class="grammar-body" id="gb${i}">
        ${g.pattern?`<div class="grammar-pattern">${g.pattern}</div>`:''}
        ${g.examples?.length?`<ul class="grammar-ex">${g.examples.map(ex=>`
          <li>
            <div class="grammar-ex-kr">${ex.kr} <button class="tts-btn" onclick="speak('${esc(ex.kr)}')">🔊</button></div>
            <div class="grammar-ex-zh">${ex.zh}</div>
          </li>`).join('')}</ul>`:''}
      </div>
    </div>`).join('');
}
function toggleG(i) {
  const b = document.getElementById('gb'+i);
  b.classList.toggle('open');
  document.getElementById('ga'+i).textContent = b.classList.contains('open') ? '▲' : '▼';
}

// ── QUIZ ──
function startQuiz() {
  const area = document.getElementById('quizArea');
  if (vocab.length < 4) { area.innerHTML = emptyState('🧪','需要至少 4 個單字','先用掃描功能上傳書頁'); return; }
  quizQs = [...vocab].sort(()=>Math.random()-0.5).slice(0,Math.min(10,vocab.length)).map(v => {
    const wrongs = vocab.filter(x=>x.kr!==v.kr).sort(()=>Math.random()-0.5).slice(0,3).map(x=>x.zh);
    return { v, opts: [v.zh,...wrongs].sort(()=>Math.random()-0.5), correct: v.zh };
  });
  quizIdx = 0; quizScore = 0; renderQuiz();
}

function renderQuiz() {
  const area = document.getElementById('quizArea');
  if (quizIdx >= quizQs.length) {
    const pct = Math.round(quizScore/quizQs.length*100);
    area.innerHTML = `<div class="score-card">
      <div class="score-num">${quizScore}/${quizQs.length}</div>
      <div class="score-label">正確率 ${pct}%</div>
      <button class="retry-btn" onclick="startQuiz()">🔄 再測一次</button>
    </div>`; return;
  }
  const q = quizQs[quizIdx];
  const pct = quizIdx/quizQs.length*100;
  area.innerHTML = `
    <div class="quiz-meta">
      <span>第 ${quizIdx+1} 題 / ${quizQs.length} 題</span>
      <span>✅ ${quizScore}</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="quiz-word-card">
      <div class="quiz-prompt">這個韓文的意思是？</div>
      <div class="quiz-word">${q.v.kr}</div>
      ${q.v.reading?`<div class="quiz-rom">${q.v.reading}</div>`:''}
    </div>
    <div class="quiz-opts">
      ${q.opts.map(o=>`<button class="quiz-opt" onclick="answerQuiz('${esc(o)}','${esc(q.correct)}',this)">${o}</button>`).join('')}
    </div>`;
}

function answerQuiz(chosen, correct, btn) {
  document.querySelectorAll('.quiz-opt').forEach(b => {
    b.disabled = true;
    if (b.textContent.trim() === correct) b.classList.add('correct');
  });
  if (chosen === correct) { quizScore++; toast('🎉 正確！'); }
  else { btn.classList.add('wrong'); toast('❌ 答錯了'); }
  setTimeout(() => { quizIdx++; renderQuiz(); }, 1200);
}

// ── TTS ──
function speak(text) {
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ko-KR'; u.rate = 0.85;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

// ── UTILS ──
function esc(s) { return (s||'').replace(/'/g,"\\'").replace(/"/g,'&quot;'); }
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
function emptyState(icon, title, sub) {
  return `<div class="empty"><div class="eicon">${icon}</div><h3>${title}</h3><p>${sub}</p></div>`;
}
</script>
